# =============================================================================
# STRATEGY OPTIMIZATION GRID CONFIGURATION
# =============================================================================
# This file defines the parameter search space for strategy optimization.
# The optimizer will test all combinations of the parameters below.
#
# To reduce the search space, comment out options you don't want to test.
# =============================================================================

# -----------------------------------------------------------------------------
# DATA PATHS (fixed for all combinations)
# -----------------------------------------------------------------------------
input_data_path: "../data/dummy_data.csv"
price_data_path: "../data/ohlcv2.parquet"
index_data_path: "../data/index_data_validated.csv"

# Quarter range for backtesting
first_quarter: 202402
last_quarter: 202405

# Initial capital (in INR)
initial_capital: 1000000000  # 100 Crores

# Risk-free rate for Sharpe/Sortino calculations
risk_free_rate: 0.065  # 6.5% (India)

# -----------------------------------------------------------------------------
# PARAMETER GRID
# -----------------------------------------------------------------------------
# Each key below contains a list of values to test.
# The optimizer will create all combinations.

parameter_grid:
  # Stock selection scheme
  category_scheme:
    - 'volatility'
    # - 'mcap'
  
  # Stock counts per category [cat1, cat2, cat3]
  # For volatility: [high, medium, low]
  # For mcap: [largecap, midcap, smallcap]
  category_counts:
    - [10, 10, 10]      # Equal distribution (30 total)
    # - [5, 10, 15]       # More low-vol/smallcap
    # - [15, 10, 5]       # More high-vol/largecap
    # - [8, 12, 10]       # Slight tilt to medium
  
  # Category weights [cat1, cat2, cat3] - must sum to 1.0
  category_weights:
    - [0.33, 0.34, 0.33]  # Equal weights
    # - [0.2, 0.4, 0.4]     # Underweight high-risk
    # - [0.4, 0.4, 0.2]     # Overweight high-risk
    # - [0.25, 0.5, 0.25]   # Heavy medium allocation
  
  # Selection method within each category
  selection_method:
    - 'probability'       # Rank by model probability
    # - 'risk_adjusted'     # Rank by probability/volatility
  
  # Minimum probability threshold (null = no filter)
  min_prob_threshold:
    - null
    # - 0.5
    # - 0.6
  
  # TP/SL mode
  tpsl_mode:
    # - 'fixed'
    - 'atr'
    # - 'pivot'

# -----------------------------------------------------------------------------
# MODE-SPECIFIC PARAMETER GRIDS
# -----------------------------------------------------------------------------
# These are only used when the corresponding tpsl_mode is selected.

# Fixed mode: TP/SL as percentages per category
fixed_mode_grid:
  # TP percentages [high_vol/largecap, med_vol/midcap, low_vol/smallcap]
  tp_pct:
    - [0.08, 0.05, 0.03]   # Conservative
    - [0.10, 0.07, 0.05]   # Moderate
    - [0.12, 0.08, 0.05]   # Aggressive TP
    - [0.15, 0.10, 0.06]   # Very aggressive TP
  
  # SL percentages [high_vol/largecap, med_vol/midcap, low_vol/smallcap]
  sl_pct:
    - [0.05, 0.04, 0.03]   # Tight stops
    - [0.08, 0.06, 0.04]   # Moderate stops
    - [0.10, 0.08, 0.05]   # Wider stops
    - [0.12, 0.10, 0.06]   # Very wide stops

# ATR mode parameters
atr_mode_grid:
  period:
    # - 10
    - 14
    # - 20
  tp_multiplier:
    # - 1.5
    - 2.0
    - 2.5
    # - 3.0
  sl_multiplier:
    # - 1.0
    # - 1.5
    - 2.0

# Pivot mode parameters
pivot_mode_grid:
  lookback_days:
    - 30
    - 60
    - 90
  tp_level:
    - 'R1'
    - 'R2'
  sl_level:
    - 'S1'
    - 'S2'

# -----------------------------------------------------------------------------
# OUTPUT CONFIGURATION
# -----------------------------------------------------------------------------
output:
  # Where to save results
  output_dir: "../optimization_results"
  
  # Save detailed trade results for each combination? (can be large)
  save_trade_details: false
  
  # Number of top results to highlight
  top_n: 10

# -----------------------------------------------------------------------------
# FILTERING / CONSTRAINTS (optional)
# -----------------------------------------------------------------------------
# Skip combinations that don't make sense

constraints:
  # Ensure weights sum to approximately 1.0 (with tolerance)
  weights_sum_tolerance: 0.01
  
  # Skip if total stock count is below this
  min_total_stocks: 15
  
  # Skip if total stock count exceeds this
  max_total_stocks: 50
