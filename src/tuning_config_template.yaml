# =============================================================================
# OPTUNA TUNING CONFIGURATION
# =============================================================================
# This file defines the search space for backtesting strategy optimization.
# Parameters are either fixed (passed through) or tunable (sampled by Optuna).

# =============================================================================
# FIXED PARAMETERS (not sampled)
# =============================================================================
fixed:
  # Data paths
  # Input data format depends on run_stock_selection setting:
  # - If run_stock_selection: true  → csv/parquet with quarter, co_name, prob, and either volatility or category
  # - If run_stock_selection: false → csv/parquet with quarter, co_name, stock_weight, and optionally category
  input_data_path: "../data/inference_data_validated/inference_data.csv"
  # csv/parquet with date, co_name, open, high, low, close
  price_data_path: "../data/price_data/ohlcv2.parquet"
  # csv/parquet with date, value
  index_data_path: "../data/index_data/index_data_validated.csv"
  
  # Quarter range for tuning (both inclusive)
  # These define the validation period over which the objective value is computed
  first_quarter: null
  last_quarter: null
  
  # Specify if stock selection is required
  run_stock_selection: true
  
  # Validate input data for price coverage issues
  # Set to false if data has already been validated to skip validation step
  validate_input_data: false
  
  # Risk-free rate applied to idle cash (exit proceeds + uninvested capital).
  # null = use global default (6.5%), 0 = no cash appreciation.
  risk_free_rate: null

  # Report generation (keep disabled during tuning for speed)
  generate_report: false

# =============================================================================
# TP/SL MODE SAMPLING
# =============================================================================
# Controls how TP and SL modes are sampled during tuning.
# - false (default): One mode is sampled from tpsl_mode choices and assigned to
#   both TP and SL (linked, backward compatible).
# - true: tp_mode and sl_mode are sampled independently from the same tpsl_mode
#   choices list, enabling mixed strategies (e.g., ATR for TP, pivot for SL).
independent_tpsl_modes: false

# =============================================================================
# SEARCH SPACE DEFINITION
# =============================================================================
# Each parameter specifies its type and either choices (categorical) or 
# low/high bounds (int/float).
#
# Types:
#   - categorical: discrete choices (use 'choices' list)
#   - int: integer range (use 'low' and 'high')
#   - float: float range (use 'low', 'high', and optionally 'step')

search_space:
  # -------------------------------------------------------------------------
  # Stock Selection Parameters
  # -------------------------------------------------------------------------
  
  # Selection type: 'category_based' selects from volatility/mcap buckets,
  # 'top_k' simply selects top k stocks by probability or risk-adjusted score
  selection_type:
    type: categorical
    choices: ['category_based', 'top_k']
  
  # Category scheme (used by category_based selection and for TP/SL lookup)
  category_scheme:
    type: categorical
    choices: ['volatility', 'mcap']
  
  # Number of stocks to select per category (only used when selection_type: 'category_based')
  # Format: [cat1, cat2, cat3] where categories depend on category_scheme:
  #   volatility: [high_vol, medium_vol, low_vol]
  #   mcap: [largecap, midcap, smallcap]
  category_counts:
    type: categorical
    choices:
      - [10, 10, 10]
      - [5, 10, 15]
      - [15, 15, 15]
      - [10, 15, 20]
      - [20, 20, 20]
  
  # Portfolio weight allocation per category (only used when selection_type: 'category_based'
  # and category_based_selection_weighting_scheme: 'use_category_weights')
  category_weights:
    type: categorical
    choices:
      - [0.33, 0.33, 0.34]
      - [0.20, 0.40, 0.40]
      - [0.40, 0.40, 0.20]
      - [0.25, 0.50, 0.25]
      - [0.50, 0.30, 0.20]
  
  # Capital allocation scheme for category-based selection
  # - 'use_category_weights': use category_weights to allocate capital by category
  # - 'equal': equal weight across all selected stocks regardless of category
  # Only used when selection_type: 'category_based'
  # When 'equal' is selected, category_weights is not sampled
  category_based_selection_weighting_scheme:
    type: categorical
    choices: ['use_category_weights', 'equal']
  
  # -------------------------------------------------------------------------
  # Cross-Dimensional Selection/Weighting (optional, category_based only)
  # -------------------------------------------------------------------------
  # These enable independent control of which dimension is used for stock
  # selection vs. capital weighting. When omitted, both default to category_scheme.
  #
  # selection_dimension: which axis to bucket stocks by for selection
  #   'volatility' → tercile-based (high/med/low volatility)
  #   'mcap' → market-cap based (largecap/midcap/smallcap)
  #
  # weighting_dimension: which axis to allocate capital by
  #   Same choices as selection_dimension.
  #
  # Cross-dimensional example: select by volatility, weight by mcap
  #   → Stocks are picked from volatility buckets using category_counts,
  #     but capital is allocated across mcap groups using category_weights.
  #
  # Uncomment to enable cross-dimensional tuning:
  # selection_dimension:
  #   type: categorical
  #   choices: ['volatility', 'mcap']
  # weighting_dimension:
  #   type: categorical
  #   choices: ['volatility', 'mcap']
  
  # tpsl_category_dimension: which dimension's categories are used for tiered
  # TP/SL threshold lookup. Only relevant when tp_mode or sl_mode is 'tiered'.
  #   'selection' → use selection_dimension categories (default)
  #   'weighting' → use weighting_dimension categories
  # Uncomment to enable tuning:
  # tpsl_category_dimension:
  #   type: categorical
  #   choices: ['selection', 'weighting']
  
  # Stock ranking method
  sort_by:
    type: categorical
    choices: ['probability', 'risk_adjusted_probability']
  
  # Minimum probability threshold (null = no filter)
  min_prob_threshold:
    type: categorical
    choices: [null, 0.45, 0.50, 0.55, 0.60]
  
  # -------------------------------------------------------------------------
  # TP/SL Configuration
  # -------------------------------------------------------------------------
  # Enable/disable take profit and stop loss independently
  tp_enabled:
    type: categorical
    choices: [true, false]
  
  sl_enabled:
    type: categorical
    choices: [true, false]
  
  # TP/SL calculation mode choices
  # When independent_tpsl_modes is false: one mode is sampled and used for both TP and SL
  # When independent_tpsl_modes is true: tp_mode and sl_mode are sampled independently
  #   from this same choices list
  # - tiered: per-category percentage thresholds 
  # - flat: uniform percentage for all stocks
  # - atr: ATR-based dynamic thresholds
  # - pivot: pivot point based thresholds
  tpsl_mode:
    type: categorical
    choices: ['tiered', 'flat', 'atr', 'pivot']

# =============================================================================
# SELECTION TYPE-SPECIFIC SEARCH SPACES
# =============================================================================
# These are only sampled when the corresponding selection_type is selected.

# Top-k selection parameters (sampled when selection_type: 'top_k')
top_k:
  # Number of top stocks to select per quarter
  k:
    type: int
    low: 10
    high: 50
  
  # Weighting scheme for selected stocks
  weighting_scheme:
    type: categorical
    choices: ['equal']  # Currently only 'equal' supported

# =============================================================================
# TPSL MODE-SPECIFIC SEARCH SPACES
# =============================================================================
# These are only sampled when the corresponding tp_mode/sl_mode uses that mode.

# Tiered TP/SL thresholds (sampled when tp_mode/sl_mode: 'tiered')
# Format: [cat1, cat2, cat3] matching category_scheme order
tiered_tpsl:
  tp_thresholds:
    type: categorical
    choices:
      - [0.10, 0.05, 0.02]   
      - [0.08, 0.06, 0.04]   
      - [0.12, 0.08, 0.05]   
      - [0.06, 0.04, 0.03]   
      - [0.15, 0.10, 0.05]
  
  sl_thresholds:
    type: categorical
    choices:
      - [0.10, 0.10, 0.10] 
      - [0.08, 0.06, 0.04] 
      - [0.12, 0.08, 0.05] 
      - [0.05, 0.05, 0.05] 
      - [0.15, 0.10, 0.08] 

# Flat TP/SL (sampled when tp_mode/sl_mode: 'flat')
# Single uniform percentage applied to ALL stocks (no category dependency)
flat_tpsl:
  tp:
    type: float
    low: 0.02
    high: 0.15
    step: 0.01
  
  sl:
    type: float
    low: 0.02
    high: 0.15
    step: 0.01

# ATR-based TP/SL (sampled when tp_mode/sl_mode: 'atr')
atr_tpsl:
  period:
    type: int
    low: 7
    high: 21
  
  tp_multiplier:
    type: float
    low: 1.5
    high: 3.5
  
  sl_multiplier:
    type: float
    low: 1.0
    high: 2.5

# Pivot-based TP/SL (sampled when tp_mode/sl_mode: 'pivot')
pivot_tpsl:
  lookback_days:
    type: int
    low: 30
    high: 90
  
  tp_level:
    type: categorical
    choices: ['R1', 'R2', 'R3']
  
  sl_level:
    type: categorical
    choices: ['S1', 'S2', 'S3']

# =============================================================================
# INDEX EXIT CONFIGURATION
# =============================================================================
# Index-guided exit strategy parameters

index_exit:
  # Regime filter: exit when index is below moving average
  regime_filter_enabled:
    type: categorical
    choices: [true, false]
  
  # Sub-parameters (sampled when regime_filter_enabled is true)
  regime_ma_period:
    type: int
    low: 10
    high: 50
  
  regime_exit_threshold:
    type: float
    low: -0.05
    high: -0.01
  
  # Volatility adjustment: adjust TP/SL based on market volatility
  vol_adjustment_enabled:
    type: categorical
    choices: [true, false]
  
  # Sub-parameters (sampled when vol_adjustment_enabled is true)
  vol_lookback:
    type: int
    low: 10
    high: 30
  
  high_vol_threshold:
    type: float
    low: 0.20
    high: 0.35
  
  low_vol_threshold:
    type: float
    low: 0.10
    high: 0.20
  
  high_vol_multiplier:
    type: float
    low: 1.2
    high: 2.0
  
  low_vol_multiplier:
    type: float
    low: 0.6
    high: 0.9

# =============================================================================
# OPTUNA SETTINGS
# =============================================================================
optuna:
  # Study identifier
  study_name: "backtest_calmar_optimization"
  
  # ---------------------------------------------------------------------------
  # Single-Objective Optimization
  # ---------------------------------------------------------------------------
  # Use 'objective' (string) + 'direction' (string) for single-objective mode.
  #
  # Supported objectives:
  #   - 'calmar': Calmar ratio (CAGR / |Max Drawdown|)
  #   - 'cagr': Compound Annual Growth Rate
  #   - 'mdd': Maximum Drawdown (magnitude)
  #
  # Direction:
  #   - 'maximize' for 'calmar' and 'cagr'
  #   - 'minimize' for 'mdd'
  objective: "calmar"
  direction: "maximize"
  
  # Penalty for failed trials (use negative when maximizing, positive when minimizing)
  failure_penalty: -999.0
  
  # Cap Calmar ratio to avoid inflated values from tiny drawdowns
  # Only applies when 'calmar' is the objective (single or multi)
  calmar_cap: 10.0
  
  # ---------------------------------------------------------------------------
  # Multi-Objective Optimization (uncomment to enable)
  # ---------------------------------------------------------------------------
  # Use 'objectives' (list) + 'directions' (list) for multi-objective mode.
  # This produces a Pareto front of non-dominated solutions instead of a single best.
  #
  # IMPORTANT: 'objective' and 'objectives' are mutually exclusive.
  # To enable multi-objective, COMMENT OUT 'objective' and 'direction' above,
  # then UNCOMMENT 'objectives' and 'directions' below.
  # Having both will raise a configuration error.
  #
  # Recommended sampler for multi-objective: 'NSGA-II' or 'NSGA-III'
  #
  # Example: maximize CAGR while minimizing drawdown
  # objectives: ['cagr', 'mdd']
  # directions: ['maximize', 'minimize']
  # failure_penalties: [-999.0, 999.0]
  #
  # You can combine any supported objectives (including 'calmar').
  # Length of 'directions' and 'failure_penalties' must match 'objectives'.
  # If 'failure_penalties' is omitted, defaults are auto-derived from directions.
  
  # Number of trials
  n_trials: 100
  
  # Sampler algorithm
  # Single-objective: 'TPE' (recommended), 'Random', 'CmaEs'
  # Multi-objective:  'NSGA-II' (recommended), 'NSGA-III', 'TPE', 'Random'
  # Note: 'CmaEs' does NOT support multi-objective optimization.
  # If not specified for multi-objective, defaults to 'NSGA-II'.
  sampler: "TPE"
  
  # Resume existing study if it exists, or start fresh
  load_if_exists: true
