# Regime Date Definitions for Portfolio Analysis
#
# Crisis Regimes — specific crisis events and their recovery periods
# Market Regimes — bull, bear, and recovery market phases
#
# These dates are used by the reporting module to compute regime-specific returns.
# Dates are in DD-MM-YYYY format.
# The analysis code automatically skips regimes that fall outside the backtesting period.

crisis_regimes:
  Global Financial Crisis:
    crisis_start: "08-01-2008"
    crisis_end: "27-10-2008"
    recovery_start: "28-10-2008"
    recovery_end: "31-10-2009"

  Taper Tantrum:
    crisis_start: "01-01-2013"
    crisis_end: "30-08-2013"
    recovery_start: "31-08-2013"
    recovery_end: "31-08-2014"

  Yuan Devaluation:
